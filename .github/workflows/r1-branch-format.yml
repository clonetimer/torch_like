name: R1 temporary formatting
on:
  push:
    branches: [feat/r1-diagnostics-contracts-20261019]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint/format baseline
        run: python -m pip install ruff==0.17.1
      - name: Format diagnostics contracts and tests
        run: python -m ruff format torch_like/diagnostics tests/test_diagnostics_contracts.py
      - name: Commit format changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch_like/diagnostics tests/test_diagnostics_contracts.py
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize finalized R1 code and tests"
            git push origin HEAD:refs/heads/feat/r1-diagnostics-contracts-20261019
          fi
