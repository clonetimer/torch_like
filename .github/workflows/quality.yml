name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q torch_like runner tests examples tools
      - name: Lint
        run: python -m ruff check torch_like runner tests examples tools
      - name: Test with coverage
        run: python -m pytest --cov=torch_like --cov-report=term-missing
