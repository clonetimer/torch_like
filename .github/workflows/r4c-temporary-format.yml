name: R4c scoped Ruff normalization
on:
  push:
    branches:
      - feat/r4c-generalization-protocol-20261020
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize R4c Python files
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --fix torch_like/diagnostics/generalization.py tests/test_diagnostics_generalization.py torch_like/diagnostics/__init__.py
          python -m ruff format torch_like/diagnostics/generalization.py tests/test_diagnostics_generalization.py torch_like/diagnostics/__init__.py
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torch_like/diagnostics/generalization.py tests/test_diagnostics_generalization.py torch_like/diagnostics/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(R4c): Ruff normalize domain holdout implementation'
            git push origin HEAD:refs/heads/feat/r4c-generalization-protocol-20261020
          fi
