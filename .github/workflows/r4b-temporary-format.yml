name: R4b scoped Ruff normalization
on:
  push:
    branches:
      - feat/r4b-fault-source-evidence-20261019
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format R4b source and tests
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --fix torch_like/diagnostics/fault_sources.py tests/test_diagnostics_fault_sources.py torch_like/diagnostics/__init__.py
          python -m ruff format torch_like/diagnostics/fault_sources.py tests/test_diagnostics_fault_sources.py torch_like/diagnostics/__init__.py
      - name: Commit Ruff changes to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torch_like/diagnostics/fault_sources.py tests/test_diagnostics_fault_sources.py torch_like/diagnostics/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: Ruff normalize fault-source evidence mapping'
            git push origin HEAD:refs/heads/feat/r4b-fault-source-evidence-20261019
          fi
