name: temporary-p4-format
on:
  push:
    branches: ["feat/diagnostics-score-projection-p4"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/diagnostics-score-projection-p4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diagnostics-score-projection-p4
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format changed P4 files
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --select I --fix torch_like/diagnostics/score_projection.py tests/test_diagnostics_score_projection.py torch_like/diagnostics/__init__.py
          python -m ruff format torch_like/diagnostics/score_projection.py tests/test_diagnostics_score_projection.py torch_like/diagnostics/__init__.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch_like/diagnostics/score_projection.py tests/test_diagnostics_score_projection.py torch_like/diagnostics/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m "style(diagnostics): format P4 with pinned Ruff"
            git push origin HEAD:feat/diagnostics-score-projection-p4
          fi
