name: R0 checked API baseline refresh
on:
  push:
    branches:
      - fix/r0-quality-gates-20261019
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install supported CPU runtime
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Rebuild only if API transition is compatible
        run: python tools/audit_public_api.py --write
      - name: Show auditable manifest changes
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:governance/public_api_baseline.json"], text=True))
          new = json.loads(Path("governance/public_api_baseline.json").read_text())
          changes = [
              name for name in sorted(set(old["symbols"]) | set(new["symbols"]))
              if old["symbols"].get(name) != new["symbols"].get(name)
          ]
          print("Old protected symbol count:", len(old["symbols"]))
          print("New protected symbol count:", len(new["symbols"]))
          print("Changed entries:", len(changes))
          for name in changes[:50]:
              print("CHANGED", name, "old=", old["symbols"].get(name), "new=", new["symbols"].get(name))
          PY
          git diff --stat -- governance/public_api_baseline.json
      - name: Commit verified nonbreaking API manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/public_api_baseline.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh nonbreaking public API manifest after verified transition"
            git push origin HEAD:refs/heads/fix/r0-quality-gates-20261019
          fi
