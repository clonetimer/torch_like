name: temporary-p5-format
on:
  push:
    branches: ["feat/native-anomaly-abi-p5"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/native-anomaly-abi-p5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-anomaly-abi-p5
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format only new Python native files
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --select I --fix torch_like/native/anomaly.py torch_like/native/__init__.py tests/test_native_abi.py
          python -m ruff format torch_like/native/anomaly.py torch_like/native/__init__.py tests/test_native_abi.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch_like/native/anomaly.py torch_like/native/__init__.py tests/test_native_abi.py
          if ! git diff --cached --quiet; then
            git commit -m "style(native): format P5 with pinned Ruff"
            git push origin HEAD:feat/native-anomaly-abi-p5
          fi
