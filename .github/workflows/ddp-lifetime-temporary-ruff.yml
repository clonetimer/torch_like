name: Scoped DDP lifetime Ruff normalization
on:
  push:
    branches:
      - fix/ddp-break-trainer-objective-cycles-20261020
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize only DDP fix files
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --fix torch_like/training/_ddp.py tests/test_ddp_lifetime.py
          python -m ruff format torch_like/training/_ddp.py tests/test_ddp_lifetime.py
      - name: Commit format change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torch_like/training/_ddp.py tests/test_ddp_lifetime.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(ddp): format lifetime regression with locked Ruff'
            git push origin HEAD:refs/heads/fix/ddp-break-trainer-objective-cycles-20261020
          fi
