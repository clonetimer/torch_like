name: temporary-p6-neural-format
on:
  push:
    branches: ["test/aas-phase9-cross-project-parity"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test/aas-phase9-cross-project-parity'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/aas-phase9-cross-project-parity
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Normalize new neural golden test using pinned Ruff
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --select I --fix tests/test_aas_phase9_neural_frozen.py
          python -m ruff format tests/test_aas_phase9_neural_frozen.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_aas_phase9_neural_frozen.py
          if ! git diff --cached --quiet; then
            git commit -m "style(interop): normalize neural parity test"
            git push origin HEAD:test/aas-phase9-cross-project-parity
          fi
