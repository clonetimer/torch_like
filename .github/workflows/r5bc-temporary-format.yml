name: R5bc temporary pinned Ruff normalization
on:
  push:
    branches:
      - feat/r5bc-diagnostic-composition-rul-api-20261020
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Normalize R5bc source under locked Ruff
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --fix torch_like/diagnostics/composition.py torch_like/diagnostics/rul_interface.py torch_like/diagnostics/__init__.py tests/test_diagnostics_composition.py tests/test_diagnostics_rul_interface.py packaging/stable/prepare.py packaging/stable/smoke_test.py
          python -m ruff format torch_like/diagnostics/composition.py torch_like/diagnostics/rul_interface.py torch_like/diagnostics/__init__.py tests/test_diagnostics_composition.py tests/test_diagnostics_rul_interface.py packaging/stable/prepare.py packaging/stable/smoke_test.py
      - name: Commit scoped formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torch_like/diagnostics/composition.py torch_like/diagnostics/rul_interface.py torch_like/diagnostics/__init__.py tests/test_diagnostics_composition.py tests/test_diagnostics_rul_interface.py packaging/stable/prepare.py packaging/stable/smoke_test.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(R5bc): format algorithm adapters using pinned Ruff'
            git push origin HEAD:refs/heads/feat/r5bc-diagnostic-composition-rul-api-20261020
          fi
