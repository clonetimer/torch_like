name: stable-algorithms-wheel

on:
  push:
    branches:
      - main
    paths:
      - "packaging/stable/**"
      - "tests/test_stable_packaging.py"
      - "torch_like/diagnostics/**"
      - "torch_like/models/**"
      - "torch_like/classical/**"
      - ".github/workflows/stable-wheel.yml"
  pull_request:
    paths:
      - "packaging/stable/**"
      - "tests/test_stable_packaging.py"
      - "torch_like/diagnostics/**"
      - "torch_like/models/**"
      - "torch_like/classical/**"
      - ".github/workflows/stable-wheel.yml"

permissions:
  contents: read

jobs:
  stable-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned CPU Torch and algorithm dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.20" "scikit-learn==1.8.0" "setuptools>=77.0" wheel "build>=1.2"
      - name: Compile builder and staged package
        run: |
          python -m compileall -q packaging/stable
          python packaging/stable/prepare.py --destination build/stable
          python -m compileall -q build/stable/src
      - name: Build independent wheel
        run: |
          python -m build --wheel --no-isolation --outdir dist/stable build/stable
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist/stable").glob("torch_like_algorithms-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              files = archive.namelist()
          allowed = "torch_like_stable/"
          forbidden = ("automl", "training", "evaluation", "data", "runtime", "serialization", "runner")
          assert all(
              not filename.startswith(f"{allowed}{part}/")
              for filename in files
              for part in forbidden
          )
          assert not any(
              filename.startswith("torch_like_stable/diagnostics/" + bad)
              for filename in files
              for bad in ("workflow.py", "selection.py", "generalization.py", "uncertainty.py")
          )
          assert any(filename == "torch_like_stable/diagnostics/health.py" for filename in files)
          assert any(filename == "torch_like_stable/models/diagnosis/inception_time.py" for filename in files)
          print("STABLE WHEEL CONTENTS PASS", wheels[0])
          PY
      - name: Isolated wheel installation and algorithm smoke tests
        run: |
          python -m pip install --force-reinstall --no-deps dist/stable/torch_like_algorithms-*.whl
          cd /tmp
          python -I "$GITHUB_WORKSPACE/packaging/stable/smoke_test.py"
      - name: Publish verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: torch-like-algorithms-stable-${{ github.sha }}
          path: |
            dist/stable/*.whl
            build/stable/stable-manifest.json
          if-no-files-found: error
