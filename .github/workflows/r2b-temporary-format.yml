name: R2b temporary formatting
on:
  push:
    branches:
      - feat/r2b-pca-spectral-20261019
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format new R2b source and tests
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --fix torch_like/diagnostics/features.py torch_like/diagnostics/pca.py tests/test_diagnostics_features.py tests/test_diagnostics_pca.py torch_like/diagnostics/__init__.py
          python -m ruff format torch_like/diagnostics/features.py torch_like/diagnostics/pca.py tests/test_diagnostics_features.py tests/test_diagnostics_pca.py torch_like/diagnostics/__init__.py
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch_like/diagnostics/features.py torch_like/diagnostics/pca.py tests/test_diagnostics_features.py tests/test_diagnostics_pca.py torch_like/diagnostics/__init__.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format R2b numerical diagnostics with pinned Ruff"
            git push origin HEAD:refs/heads/feat/r2b-pca-spectral-20261019
          fi
