name: R0 branch formatting repair
on:
  push:
    branches:
      - fix/r0-quality-gates-20261019
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pinned Ruff
        run: python -m pip install "ruff>=0.15,<0.17"
      - name: Apply safe lint autofixes
        run: python -m ruff check --fix torch_like runner tests examples tools || true
      - name: Apply formatter
        run: python -m ruff format torch_like runner tests examples tools
      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch_like runner tests examples tools
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff fixes and deterministic formatting"
            git push origin HEAD:refs/heads/fix/r0-quality-gates-20261019
          fi
