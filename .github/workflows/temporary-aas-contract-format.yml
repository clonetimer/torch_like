name: temporary-aas-contract-format
on:
  push:
    branches: ["feat/aas-diagnostic-contracts-p1-p2"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/aas-diagnostic-contracts-p1-p2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aas-diagnostic-contracts-p1-p2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format ONLY changed diagnostics files
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --select I --fix torch_like/diagnostics/types.py torch_like/diagnostics/statistical.py torch_like/diagnostics/registry.py torch_like/diagnostics/decisions.py torch_like/diagnostics/__init__.py tests/test_diagnostics_aas_contracts.py
          python -m ruff format torch_like/diagnostics/types.py torch_like/diagnostics/statistical.py torch_like/diagnostics/registry.py torch_like/diagnostics/decisions.py torch_like/diagnostics/__init__.py tests/test_diagnostics_aas_contracts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch_like/diagnostics/types.py torch_like/diagnostics/statistical.py torch_like/diagnostics/registry.py torch_like/diagnostics/decisions.py torch_like/diagnostics/__init__.py tests/test_diagnostics_aas_contracts.py
          if ! git diff --cached --quiet; then
            git commit -m "style(diagnostics): format P1/P2 with pinned Ruff"
            git push origin HEAD:feat/aas-diagnostic-contracts-p1-p2
          fi
