name: ddp-cpu-gloo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  two-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_ddp_runtime.py tests/test_checkpoint_compatibility.py tests/test_training_runtime.py -q
