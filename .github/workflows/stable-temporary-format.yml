name: Stable scoped Ruff normalization
on:
  push:
    branches:
      - feat/stable-algorithms-only-wheel-20261020
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Normalize stable packaging tools
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check --fix packaging/stable tests/test_stable_packaging.py
          python -m ruff format packaging/stable tests/test_stable_packaging.py
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/stable tests/test_stable_packaging.py
          if ! git diff --cached --quiet; then
            git commit -m 'style(stable): align packaging source with pinned Ruff'
            git push origin HEAD:refs/heads/feat/stable-algorithms-only-wheel-20261020
          fi
