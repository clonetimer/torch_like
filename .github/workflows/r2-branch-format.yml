name: R2 temporary formatting
on:
  push:
    branches: [feat/r2-statistical-detectors-20261019]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.1
      - name: Normalize new detector implementation and tests
        run: python -m ruff format torch_like/diagnostics/statistical.py tests/test_diagnostics_statistical.py
      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torch_like/diagnostics/statistical.py tests/test_diagnostics_statistical.py
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize R2 statistical detector code and tests"
            git push origin HEAD:refs/heads/feat/r2-statistical-detectors-20261019
          fi
