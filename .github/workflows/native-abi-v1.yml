name: native-abi-v1
on:
  push:
    paths:
      - "torch_like/native/**"
      - "examples/native/**"
      - "tests/test_native_abi.py"
      - "pyproject.toml"
      - ".github/workflows/native-abi-v1.yml"
  pull_request:
    paths:
      - "torch_like/native/**"
      - "examples/native/**"
      - "tests/test_native_abi.py"
      - "pyproject.toml"
      - ".github/workflows/native-abi-v1.yml"
jobs:
  c-abi-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enable MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Require native compiler
        run: python -c "import shutil; assert any(shutil.which(x) for x in ('gcc', 'cc', 'clang', 'cl')), 'C compiler missing'"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify C ABI compile-load-fit-score-checkpoint
        run: python -m pytest tests/test_native_abi.py -q -rs
