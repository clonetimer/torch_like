task_id: esa-mission1-light-anomaly-smoke
dataset:
  path: E:/Data/ESA-Mission1.zip
  format: esa_adb
  label_columns: [channel_41, channel_42, channel_43, channel_44, channel_45, channel_46]
  feature_columns: [channel_41, channel_42, channel_43, channel_44, channel_45, channel_46]
  sample_mode: sliding_window
  sequence_length: 64
  stride: 30
  resample_seconds: 30
  split_time_ranges:
    train: ["2006-07-01", "2006-09-30 23:59:30"]
    val: ["2006-10-01", "2006-12-31 23:59:30"]
    test: ["2007-04-01", "2007-06-30 23:59:30"]
  anomaly_categories: [Anomaly, Rare Event]
  cache_dir: runs/data_cache/esa-adb
  scale: large
task:
  type: anomaly_detection
split:
  type: predefined
resources:
  device: cuda
  max_total_minutes: 45
  timeout_per_trial_minutes: 10
  max_cpu_workers: 1
  max_ram_gb: 24
  max_vram_gb: 8
search:
  strategy: grid
  max_trials: 5
  preprocessing: [standard]
  algorithms: [GlobalSTD, IsolationForest, USAD, TranAD, RTDetector]
  torch_epochs: 1
  torch_batch_size: 256
  torch_learning_rate: 0.001
  torch_optimizer: adamw
  torch_weight_decay: 0.0001
  torch_grad_clip_norm: 1.0
  anomaly_threshold_candidates: 50
ranking:
  primary_metric: event_f0_5_corrected
  additional_metrics: [point_precision, point_recall, point_f1, false_alarm_rate, alarming_precision]
artifacts:
  output_dir: runs
  save_predictions: true
  save_checkpoints: true
seed: 42
